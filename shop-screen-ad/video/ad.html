<style>

*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0B1B3F}
body{font-family:P,D,sans-serif;color:#fff;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(90% 90% at 15% 10%,#173878 0,#0B1B3F 60%)}

.pill{background:#2F6BFF;border-radius:60px;padding:16px 44px;font-size:48px;font-weight:700}

</style></head><body>

<script src="content.js"></script><script src="offer.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=p=>1-Math.pow(1-clamp(p),3);
const L=['en','hi','mr'];
const START=[0,5,12,19,26,32,38,44,49,57,60];
window.TOTAL=180;
const LT='M243 360 L243 208.75 A118.75 118.75 0 0 1 480 208.75 L480 445 L437 408 L437 208.75 A74.75 74.75 0 0 0 287 208.75 L287 325 Z';
const logoSVG=(h,c)=>`<svg viewBox="170 80 320 495" height="${h}" width="${h*320/495}" style="overflow:visible"><path class="lt" d="${LT}" fill="${c}"/><path class="lb" d="${LT}" fill="${c}" transform="rotate(180 329 327.5)"/></svg>`;
function setLogo(el,p){const e=ease(p);const lt=el.querySelector('.lt'),lb=el.querySelector('.lb');
  lt.setAttribute('transform',`translate(0 ${-220*(1-e)})`);lb.setAttribute('transform',`translate(0 ${220*(1-e)}) rotate(180 329 327.5)`);el.style.opacity=clamp(p*4);}
$('#lg1').innerHTML=logoSVG(56,'#fff');$('#s1logo').innerHTML=logoSVG(560,'#fff');$('#s10logo').innerHTML=logoSVG(380,'#fff');
// QR
fetch('qr.svg').then(r=>r.text()).then(t=>{$('#s9qr').innerHTML=t.replace('<svg ','<svg viewBox="0 0 29 29" style="width:100%;height:100%" ');window.QRREADY=1;}).catch(()=>{window.QRREADY=1});
// dynamic builders
const imgs2=['mug','magic','pad','key'];
$('#s2cards').innerHTML=imgs2.map((m,i)=>`<div class="a" data-d="${.5+i*.55}" style="left:${96+i*430}px;top:260px;width:400px"><img class="img" src="img/${m}.jpg" style="width:400px;height:400px;display:block"><div class="t" data-k="s2.i${i+1}" style="font-size:40px;margin-top:22px"></div><div class="t blue" data-k="s2.p${i+1}" style="font-size:46px"></div></div>`).join('');
$('#s4rows').innerHTML=[1,2,3,4].map(i=>`<div class="a row" data-d="${.4+i*.4}" data-p="left" style="top:${250+(i-1)*135}px"><span class="l" data-k="s4.i${i}"></span><span class="r" data-k="s4.p${i}"></span></div>`).join('');
$('#s6steps').innerHTML=[1,2,3].map(i=>`<div class="a" data-d="${.6+(i-1)*1.4}" data-p="pop" style="left:${380+(i-1)*580-90}px;top:350px;width:180px;height:180px;border-radius:50%;background:#2F6BFF;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:800;box-shadow:0 0 0 14px #2F6BFF33">${i}</div><div class="a t" data-d="${.8+(i-1)*1.4}" data-k="s6.i${i}" style="left:${380+(i-1)*580-260}px;top:580px;width:520px;text-align:center;font-size:54px"></div>`).join('');
// scene 7: work cards or fallback
function build7(){
 const s=$('#s7');
 if(SETTINGS.showClientWork){
  s.innerHTML=`<div class="a t title" data-d="0" data-k="s7.title"></div>`+[1,2,3].map(i=>`<div class="a" data-d="${.4+i*.5}" style="left:${96+(i-1)*600}px;top:290px;width:560px;height:600px;background:#ffffff14;border-radius:26px;padding:40px;border:2px solid #ffffff30"><div style="height:300px;border-radius:14px;background:linear-gradient(135deg,#2F6BFF,#16336f);margin-bottom:34px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#ffffffaa">screenshot</div><div class="t" data-k="s7.i${i}" style="font-size:52px"></div><div data-k="s7.d${i}" style="font-size:36px;font-weight:500;color:#CFE0FF;margin-top:10px;line-height:1.3"></div></div>`).join('');
 }else{
  s.innerHTML=`<div class="a t title" data-d="0" data-k="s7b.title" style="font-size:88px;max-width:1500px"></div>`+[1,2,3].map(i=>`<div class="a li" data-d="${.6+i*.6}" style="top:${400+(i-1)*140}px;font-size:60px;max-width:1700px"><span class="ck">✓</span><span data-k="s7b.i${i}"></span></div>`).join('');
 }
}
build7();
// 3D scene
(function(){const N=34,H=15;let h='<svg width="640" height="800" viewBox="0 0 640 800"><rect x="60" y="690" width="520" height="22" rx="8" fill="#ffffff22"/><rect x="40" y="712" width="560" height="12" rx="6" fill="#ffffff14"/>';
 for(let i=0;i<N;i++){const f=i/N,w=190+110*Math.sin(f*Math.PI*1.15)+30*Math.sin(f*18)*0+Math.max(0,.15-f)*200;h+=`<rect class="ly" x="${320-w/2}" y="${690-(i+1)*H}" width="${w}" height="${H-1}" rx="4" fill="hsl(${215+f*12} 90% ${42+f*28}%)"/>`;}
 h+=`<g id="noz"><rect x="-210" y="0" width="420" height="16" rx="8" fill="#9bb6ee"/><path d="M-20 16 L20 16 L6 62 L-6 62 Z" fill="#CFE0FF"/><rect x="-26" y="-28" width="52" height="30" rx="6" fill="#6F9BFF"/></g></svg>`;
 $('#s5svg').innerHTML=h;})();
$('#s8img').src=OFFER.image;
// fmt chips
const fmtCache={};
// text application
let curLang=-1;
function applyLang(l){curLang=l;const lang=L[l];
 $$('[data-k]').forEach(el=>{const [a,b]=el.dataset.k.split('.');const src=a==='offer'?OFFER:C[a];el.textContent=src&&src[b]?src[b][lang]:'';});
 $('#s5fmt').innerHTML=C.s5.fmt[lang].split(' · ').map(x=>`<span class="chipf">${x}</span>`).join('');
 $$('#chip span').forEach(s=>s.classList.toggle('on',+s.dataset.l===l));
 $('#s8val').style.display=OFFER.value[lang]?'':'none';
 $('#s8valid').style.display=OFFER.validTill[lang]?'':'none';
}
const ents=$$('.sc').map(sc=>$$('#'+sc.id+' .a'));
function wipeAt(t){ // wipe over boundaries
 const bs=[0,5,12,19,26,32,38,44,49,57,60,65,72,79,86,92,98,104,109,117,120,125,132,139,146,152,158,164,169,177,180];
 let best=null;for(const b of bs){const d=t-b;if(d>-.3&&d<.3)best=d;}
 // wrap for loop seam
 if(t>179.7)best=t-180;
 return best;
}
window.render=function(t){
 t=((t%180)+180)%180;
 const l=Math.floor(t/60), lt=t-l*60;
 if(l!==curLang)applyLang(l);
 let si=0;for(let i=0;i<10;i++)if(lt>=START[i]&&lt<START[i+1])si=i;
 $$('.sc').forEach((sc,i)=>sc.style.display=i===si?'block':'none');
 const sl=lt-START[si];
 // persistent brand: hidden on intro/outro
 $('#brand').style.opacity=(si===0||si===9)?0:1;
 // background motion
 $('#b1').style.transform=`translate(${Math.sin(t*.3)*80}px,${Math.cos(t*.25)*60}px)`;
 $('#b2').style.transform=`translate(${Math.cos(t*.2)*70}px,${Math.sin(t*.35)*60}px)`;
 $('#grid').style.transform=`translate(${-(t*12)%80}px,${-(t*8)%80}px)`;
 // entries
 for(const el of ents[si]){
  const d=parseFloat(el.dataset.d||0), p=clamp((sl-d)/.7), e=ease(p), kind=el.dataset.p||'up';
  let tr='';if(kind==='up')tr=`translateY(${50*(1-e)}px)`;else if(kind==='left')tr=`translateX(${-90*(1-e)}px)`;else if(kind==='pop')tr=`scale(${.7+.3*e})`;
  el.style.opacity=e;el.style.transform=tr;
 }
 // scene specifics
 if(si===0)setLogo($('#s1logo'),clamp(sl/1.0));
 if(si===9)setLogo($('#s10logo'),clamp(sl/.9));
 if(si===5)$('#s6line').style.strokeDashoffset=1-ease(clamp((sl-.6)/2.6));
 if(si===4){const n=Math.floor(clamp((sl-.4)/4.4)*34),fr=clamp((sl-.4)/4.4)*34-n;
   $$('#s5svg .ly').forEach((r,i)=>{r.style.opacity=i<n?1:(i===n?.8:0);});
   const top=690-(n+1)*15;$('#noz').setAttribute('transform',`translate(${320+Math.sin(sl*9)*(60+30*Math.sin(sl*2))} ${top-62})`);}
 if(si===7&&OFFER.value[L[l]]){const e=ease(clamp((sl-.9)/.8));$('#s8val').style.transform=`scale(${.85+.15*e})`;$('#s8val').style.transformOrigin='left';}
 // wipe
 const w=wipeAt(t),W=$('#wipe');
 if(w===null){W.style.display='none';}else{W.style.display='block';const p=(w+.3)/.6;W.style.transform=`translateX(${-2300+(2300+1920)*p}px)`;}
};
window.ready=document.fonts.ready.then(()=>new Promise(r=>setTimeout(r,300)));
</script></body></html>
