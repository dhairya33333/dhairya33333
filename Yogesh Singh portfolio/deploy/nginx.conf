# /etc/nginx/sites-available/yogesh-portfolio   (setup-vps.sh replaces example.com; certbot adds the HTTPS block)
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 80;
    server_name example.com www.example.com;
    server_tokens off;

    # Uploads arrive in 32 MB pieces, so a small cap is enough and protects the server.
    client_max_body_size 64m;
    proxy_request_buffering off;           # stream pieces straight to the app
    proxy_connect_timeout 15s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;

    # Compress text (about 70% smaller). Video segments are already compressed, so /media/ is excluded below.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain text/vtt application/xml;

    # Never expose dotfiles or the data directories, even by mistake.
    location ~ /\. { deny all; }

    # Brute-force protection in front of the app's own limiter
    location ~ ^/api/auth/(login|register|google) {
        limit_req zone=auth burst=15 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
    }

    # Video: no compression, no buffering of the whole segment before sending.
    location /media/ {
        gzip off;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Images the admin uploaded have random file names that never change, so browsers may keep them for a month.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
