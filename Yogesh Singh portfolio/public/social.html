<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfaf7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23fbfaf7'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%239a7430' font-family='serif'%3EY%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css"><title>Social media — Y. P. Singh</title></head>
<body>
<div class="rail"></div><div class="cursor"></div>
<div id="chrome-nav"></div>
<main>
  <section class="page-hero"><div class="wrap">
    <span class="eyebrow pg-in">Social</span>
    <h1 id="title">On <em>Instagram</em></h1>
    <p class="lede pg-in" id="intro" style="animation-delay:.35s"></p>
    <div class="actions pg-in" style="animation-delay:.5s"><a class="btn primary" id="follow" href="#" target="_blank" rel="noopener" hidden>Follow on Instagram <span class="arrow">↗</span></a></div>
  </div></section>

  <section class="section" style="padding-top:0"><div class="wrap">
    <div class="sfilters" id="filters" role="tablist" aria-label="Filter posts" hidden></div>
    <div id="grid" class="sgrid" aria-live="polite"></div>
    <div id="feed-wrap" hidden>
      <span class="eyebrow" style="margin:60px 0 24px">More from the feed</span>
      <div class="ig" id="feed" style="margin-top:0"></div>
    </div>
    <div id="empty" class="empty" hidden>Posts will appear here soon. In the meantime you can follow on Instagram.</div>
    <div class="follow" id="follow-bar" data-reveal hidden><div><b>Follow along</b><br><span>New posts and reels appear here as they are shared.</span></div><a class="btn primary" id="follow2" href="#" target="_blank" rel="noopener">Follow on Instagram <span class="arrow">↗</span></a></div>
  </div></section>

  <div class="lb" id="lb" role="dialog" aria-modal="true" aria-labelledby="lb-title" hidden>
    <div class="lb-back" data-close></div>
    <div class="lb-panel">
      <button class="lb-x" data-close aria-label="Close">×</button>
      <div class="lb-media"><div class="lb-skel" id="lb-skel">Loading from Instagram…</div><div id="lb-frame"></div></div>
      <aside class="lb-info">
        <span class="eyebrow" id="lb-kind">Post</span>
        <h2 id="lb-title" class="serif">Instagram</h2>
        <p id="lb-caption"></p>
        <a class="btn primary" id="lb-open" href="#" target="_blank" rel="noopener">Open on Instagram <span class="arrow">↗</span></a>
        <div class="lb-nav"><button class="btn" id="lb-prev" aria-label="Previous post">←</button><span id="lb-count"></span><button class="btn" id="lb-next" aria-label="Next post">→</button></div>
      </aside>
    </div>
  </div>
</main>
<div id="chrome-foot"></div>
<script type="module" src="/js/social.js"></script>
</body></html>
