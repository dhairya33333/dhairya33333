<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfaf7"><meta name="robots" content="noindex,nofollow">
<title>Reset password — Y. P. Singh</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css">
</head><body>
<main class="page"><div class="card">
  <h1 tabindex="-1">Set a new password</h1>
  <p class="sub">Use the link you received from the site admin. It works once and expires after an hour.</p>
  <form id="form" novalidate>
    <label class="field"><span>New password</span><input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
    <div class="msg" id="msg" role="alert" aria-live="polite"></div>
    <button class="btn gold" id="go">Save password</button>
  </form>
</div></main>
<script type="module" src="/js/reset-password.js"></script>
</body></html>
