<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%230a0a0b'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23c9a96b' font-family='serif'%3EY%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css"><title>Sign in — Yogesh Singh</title></head>
<body>
<header class="nav stuck"><div class="wrap"><a href="/" class="brand"><i></i>Yogesh Singh</a><nav class="nav-links"><a href="/#film">Film</a><a href="/#about">About</a><a href="/#contact">Contact</a><span id="nav-auth" style="display:contents"></span></nav><button class="burger" aria-label="Menu"><span></span><span></span></button></div></header>
<main class="page"><div class="card">
  <h1 id="h">Welcome back</h1><p class="sub" id="sub">Sign in to watch the full film.</p>
  <form id="form" novalidate>
    <label class="field" id="f-name" hidden><span>Full name</span><input name="name" autocomplete="name"></label>
    <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required></label>
    <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
    <div class="msg" id="msg"></div>
    <button class="btn gold" id="go">Sign in</button>
  </form>
  <div class="switch"><span id="sw-text">New here?</span> <a href="#" class="link" id="sw">Create an account</a></div>
</div></main>
<script type="module" src="/js/login.js"></script>
</body></html>
