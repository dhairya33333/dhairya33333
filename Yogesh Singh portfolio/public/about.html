<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfaf7">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23fbfaf7'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%239a7430' font-family='serif'%3EY%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/site.css"><title>About — Y. P. Singh</title></head>
<body>
<div class="rail"></div><div class="cursor"></div>
<div id="chrome-nav"></div>
<main>
  <section class="page-hero"><div class="wrap">
    <span class="eyebrow pg-in">About</span>
    <h1 id="title" aria-live="polite"></h1>
    <p class="lede pg-in" id="roles" style="animation-delay:.35s"></p>
    <div class="actions pg-in" style="animation-delay:.5s"><a class="btn primary" href="/contact?topic=speaking">Invite him to speak <span class="arrow">→</span></a><a class="btn" href="/films">Watch the film</a></div>
  </div></section>

  <section class="section"><div class="wrap split">
    <div class="sticky" data-reveal><span class="eyebrow">The story</span><div class="stats" id="stats" style="margin-top:34px"></div></div>
    <div class="prose" id="body" data-reveal></div>
  </div></section>

  <section class="section tint" id="quote-sec" hidden><div class="wrap" style="text-align:center"><blockquote id="quote" class="serif" style="margin:0 auto;max-width:900px;font-size:clamp(32px,5vw,70px);line-height:1.08" data-reveal></blockquote></div></section>

  <section class="section"><div class="wrap">
    <span class="eyebrow" data-reveal>Journey</span>
    <h2 class="h2" data-reveal>Uniform. Camera. <em>Stage.</em></h2>
    <div class="timeline" id="timeline" data-reveal></div>
  </div></section>

  <section class="section" style="padding-top:0"><div class="wrap"><div class="band" data-reveal>
    <div><h3 id="speak-title"></h3><p id="speak-body"></p></div>
    <a class="btn gold" href="/contact?topic=speaking">Get in touch <span class="arrow">→</span></a>
  </div></div></section>
</main>
<div id="chrome-foot"></div>
<script type="module" src="/js/about.js"></script>
</body></html>
