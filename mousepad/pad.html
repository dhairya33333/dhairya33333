<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:P;src:url(poppins-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:P;src:url(poppins-latin-800-normal.woff2);font-weight:800}
@page{size:240mm 200mm;margin:0}
*{margin:0;box-sizing:border-box}
html,body{width:240mm;height:200mm;background:#0B1B3F}
.pad{position:relative;width:240mm;height:200mm;overflow:hidden;font-family:P,sans-serif;color:#fff;
 background:radial-gradient(90% 100% at 18% 12%,#1f4aa8 0,#12307a 35%,#0B1B3F 75%)}
svg.bgsvg{position:absolute;inset:0;width:100%;height:100%}
.guide{display:none;position:absolute;inset:0}
body.g .guide{display:block}
.guide .trim{position:absolute;left:10mm;top:10mm;right:10mm;bottom:10mm;border:.3mm solid #ff2d55}
.guide .safe{position:absolute;left:15mm;top:15mm;right:15mm;bottom:15mm;border:.3mm dashed #00d27a}
.c{position:absolute;left:0;right:0;text-align:center}
