<!doctype html>
<html><head><meta charset="utf-8"><title>Devdha service mock-ups</title>
<style>
:root{--navy:#12324F;--deep:#0B2238;--mid:#1E5B94;--sky:#6FB1F0;--ice:#E8F1FB;--ink:#1b2b3d}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1000px;height:1000px;overflow:hidden}
body{font-family:'Inter','Inter Display',sans-serif;font-weight:600;color:var(--ink)}
#stage{position:relative;width:1000px;height:1000px;overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#3f79b4 0%,#24598f 38%,#123a5e 78%,#0b2742 100%)}
#stage:before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.10) 1.5px,transparent 2px);background-size:34px 34px;-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
.abs{position:absolute}
.floor{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(180deg,rgba(255,255,255,0),rgba(7,25,43,.38))}
.shadow{position:absolute;background:radial-gradient(ellipse at center,rgba(3,14,28,.55),rgba(3,14,28,0) 70%);filter:blur(6px)}
/* devices */
.laptop{position:absolute;left:105px;top:215px;width:790px;transform-origin:50% 100%;transform:perspective(2200px) rotateY(-10deg) rotateX(3deg)}
.lid{width:790px;height:500px;border-radius:26px 26px 8px 8px;background:linear-gradient(160deg,#2c333c,#14181d);padding:16px 16px 22px;box-shadow:0 30px 60px rgba(0,0,0,.45),inset 0 0 0 2px #3b434d}
.screen{width:758px;height:462px;border-radius:8px;background:#fff;overflow:hidden;position:relative}
.base{width:880px;height:26px;margin:0 -45px;border-radius:0 0 30px 30px;background:linear-gradient(180deg,#c9ced6,#9aa2ad);box-shadow:0 18px 30px rgba(0,0,0,.4);position:relative}
.base:before{content:'';position:absolute;left:50%;top:0;width:150px;height:8px;margin-left:-75px;border-radius:0 0 10px 10px;background:#7b838f}
.phone{position:absolute;width:290px;height:590px;border-radius:50px;background:linear-gradient(160deg,#2a3038,#0e1115);padding:14px;box-shadow:0 34px 60px rgba(0,0,0,.5),inset 0 0 0 2px #3d454f}
.pscreen{width:262px;height:562px;border-radius:38px;background:#fff;overflow:hidden;position:relative}
.pscreen:before{content:'';position:absolute;left:50%;top:10px;width:84px;height:24px;margin-left:-42px;border-radius:14px;background:#0b0e12;z-index:5}
.paper{position:absolute;background:#fff;box-shadow:0 22px 40px rgba(2,12,24,.45),0 3px 6px rgba(2,12,24,.3);overflow:hidden}
/* ui bits */
.bar{height:34px;background:#eef2f7;display:flex;align-items:center;gap:7px;padding:0 14px;border-bottom:1px solid #dde4ec}
.dot{width:10px;height:10px;border-radius:50%;background:#c6d0dc}
.url{margin-left:14px;flex:1;height:20px;border-radius:10px;background:#fff;font-size:11px;color:#6d7f93;display:flex;align-items:center;padding:0 12px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;font-weight:800;white-space:nowrap}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(20,50,80,.10)}
.h{font-weight:800;letter-spacing:-.01em}
.mut{color:#6d7f93}
.chip{display:inline-block;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800}
.row{display:flex;align-items:center}
.logo{position:absolute}
.tag{position:absolute;left:50px;top:46px;font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:#a9d1f7;font-weight:800}
.title{position:absolute;left:50px;top:70px;width:900px;font-size:44px;color:#fff;font-weight:800;letter-spacing:-.02em;line-height:1.05}
</style></head>
<body><div id="stage"></div>
<script>
const $=s=>document.querySelector(s);
const NAVY='#12324F',MID='#1E5B94',SKY='#6FB1F0',ICE='#E8F1FB';
const LT='M243 360 L243 208.75 A118.75 118.75 0 0 1 480 208.75 L480 445 L437 408 L437 208.75 A74.75 74.75 0 0 0 287 208.75 L287 325 Z';
const mark=(c='#fff',h=40)=>`<svg viewBox="170 80 320 495" height="${h}" width="${h*320/495}"><path d="${LT}" fill="${c}"/><path d="${LT}" fill="${c}" transform="rotate(180 329 327.5)"/></svg>`;
const I={ // 24px stroke icons
 star:'<path d="M12 3L14.6 9L21 9.6L16.2 13.8L17.6 20.2L12 17L6.4 20.2L7.8 13.8L3 9.6L9.4 9Z"/>',
 bag:'<path d="M5 8H19L18 20H6Z"/><path d="M9 8V6a3 3 0 0 1 6 0V8"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7L12 13L21 7"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21C4 16 8 14 12 14C16 14 20 16 20 21"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20V13M22 20H2"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10H21M8 3V7M16 3V7"/>',
 heart:'<path d="M12 20 C4 14 3 9 6.5 6.5 C9 5 11 6 12 8 C13 6 15 5 17.5 6.5 C21 9 20 14 12 20Z"/>',
 pin:'<path d="M12 21C12 21 5 14.5 5 10a7 7 0 0 1 14 0c0 4.500-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/>',
 phone:'<path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2Z"/>',
 check:'<path d="M5 12L10 17L19 7"/>',
 play:'<path d="M7 4L19 12L7 20Z"/>',
 home:'<path d="M3 11L12 3L21 11"/><path d="M5 10V21H19V10"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M16 16L21 21"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',
 cube:'<path d="M12 3L20 7.500V16.500L12 21L4 16.500V7.500Z"/><path d="M4 7.500L12 12L20 7.500M12 12V21"/>',
 chat:'<path d="M4 5h16v11H9l-5 4Z"/>',
 camera:'<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.500" r="3.500"/><path d="M8 7l1.500-3h5L16 7"/>',
 image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M3 18l6-5 4 3 3-2 5 4"/>',
 bolt:'<path d="M13 3L5 14H11L10 21L19 9H13Z"/>',
 globe:'<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12H21"/>',
 doc:'<path d="M6 3h8l4 4v14H6Z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
 shield:'<path d="M12 3L20 6V12C20 17 16 20 12 21C8 20 4 17 4 12V6Z"/><path d="M9 12L11 14L15 10"/>',
 db:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.700 3.600 3 8 3s8-1.300 8-3V6M4 12c0 1.700 3.600 3 8 3s8-1.300 8-3"/>',
 tag:'<path d="M3 12V4h8l10 10-8 8Z"/><circle cx="7.500" cy="8.500" r="1.200"/>',
 brush:'<path d="M18 3l3 3-9 9-3-3Z"/><path d="M9 12c-3 0-4 2-4 4s-1 3-2 4c3 1 6 0 7-2s1-4-1-6Z"/>'
};
const ico=(k,c='currentColor',s=22,w=1.8)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${I[k]||''}</svg>`;
const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---------- containers ---------- */
const laptop=(inner,o={})=>`<div class="shadow" style="left:120px;top:735px;width:760px;height:90px"></div><div class="laptop" style="${o.style||''}"><div class="lid"><div class="screen">${inner}</div></div><div class="base"></div></div>`;
const phone=(inner,x,y,rot=0,s=1,z=1)=>`<div class="phone" style="left:${x}px;top:${y}px;transform:rotate(${rot}deg) scale(${s});z-index:${z}"><div class="pscreen">${inner}</div></div>`;
const browser=(url,inner)=>`<div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><div class="url">${esc(url)}</div></div><div style="height:428px;overflow:hidden;position:relative">${inner}</div>`;
const paper=(x,y,w,h,inner,rot=0,css='')=>`<div class="paper" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${rot}deg);${css}">${inner}</div>`;
const head=(tag,title)=>`<div class="tag">${esc(tag)}</div><div class="title">${esc(title)}</div>`;

/* ---------- website pieces ---------- */
const nav=(name,items,c=NAVY)=>`<div class="row" style="height:46px;padding:0 26px;justify-content:space-between;border-bottom:1px solid #edf1f6"><div class="row h" style="gap:8px;color:${c};font-size:16px">${mark(c,20)}${esc(name)}</div><div class="row" style="gap:20px;font-size:12px;color:#6d7f93">${items.map(i=>`<span>${esc(i)}</span>`).join('')}<span class="btn" style="background:${c};color:#fff;padding:7px 16px;font-size:12px">Contact</span></div></div>`;
const hero=(t,s,cta,c1,c2,h=210)=>`<div style="margin:16px 26px;height:${h}px;border-radius:20px;background:linear-gradient(120deg,${c1},${c2});position:relative;overflow:hidden;color:#fff"><div class="abs" style="right:-50px;top:-60px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.18)"></div><div class="abs" style="right:90px;bottom:24px;width:110px;height:110px;border-radius:50%;border:5px solid rgba(255,255,255,.45)"></div><div class="abs h" style="left:34px;top:${h/2-62}px;font-size:34px;line-height:1.08;width:340px">${esc(t)}</div><div class="abs" style="left:34px;top:${h/2+34}px;font-size:13px;opacity:.9;width:300px">${esc(s)}</div><span class="btn abs" style="left:34px;top:${h-52}px;background:#fff;color:${c1};padding:9px 20px;font-size:13px">${esc(cta)}</span></div>`;
const feat=(items,c=MID)=>`<div class="row" style="gap:14px;padding:0 26px">${items.map(([ic,t,s])=>`<div class="card" style="flex:1;padding:14px"><div style="width:34px;height:34px;border-radius:10px;background:${ICE};display:flex;align-items:center;justify-content:center;color:${c}">${ico(ic,c,20)}</div><div class="h" style="font-size:13px;margin-top:10px">${esc(t)}</div><div class="mut" style="font-size:11px;margin-top:3px">${esc(s)}</div></div>`).join('')}</div>`;
const site=(o)=>nav(o.name,o.nav||['Home','About','Services','Work'],o.c1||NAVY)+hero(o.h,o.s,o.cta||'Get started',o.c1||NAVY,o.c2||MID)+feat(o.f||[['star','Quality','Crafted with care'],['bolt','Fast','Quick delivery'],['shield','Reliable','Built to last']],o.c1||MID);

/* ---------- app / dashboard pieces ---------- */
const side=(items,active=0,c=NAVY)=>`<div style="width:150px;height:100%;background:${c};color:#cfe3f8;padding:18px 14px;flex:none"><div class="row h" style="gap:8px;color:#fff;font-size:15px;margin-bottom:22px">${mark('#fff',20)}Devdha</div>${items.map(([ic,t],i)=>`<div class="row" style="gap:10px;padding:9px 10px;border-radius:9px;font-size:12px;margin-bottom:4px;${i===active?'background:rgba(255,255,255,.16);color:#fff':''}">${ico(ic,'currentColor',16)}${esc(t)}</div>`).join('')}</div>`;
const kpi=(l,v,d,c=MID)=>`<div class="card" style="padding:12px 14px;flex:1"><div class="mut" style="font-size:10px">${esc(l)}</div><div class="h" style="font-size:22px;color:${NAVY};margin-top:2px">${esc(v)}</div><div style="font-size:10px;color:${c};font-weight:800">${esc(d)}</div></div>`;
const bars=(vals,c=SKY,h=80)=>`<div class="row" style="align-items:flex-end;gap:7px;height:${h}px">${vals.map(v=>`<div style="flex:1;height:${v}%;background:${c};border-radius:5px 5px 2px 2px"></div>`).join('')}</div>`;
const line=(pts,c=MID,w=300,h=80)=>{const max=Math.max(...pts),st=w/(pts.length-1);const p=pts.map((v,i)=>`${i*st},${h-(v/max)*(h-8)-4}`).join(' ');return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polygon points="0,${h} ${p} ${w},${h}" fill="${c}22"/><polyline points="${p}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/></svg>`};
const table=(cols,rows,w=520)=>`<div class="card" style="width:${w}px;overflow:hidden"><div class="row" style="background:#f3f6fa;padding:9px 14px;font-size:10px;color:#6d7f93;font-weight:800;text-transform:uppercase">${cols.map((c,i)=>`<div style="flex:${i?1:1.6}">${esc(c)}</div>`).join('')}</div>${rows.map(r=>`<div class="row" style="padding:9px 14px;font-size:12px;border-top:1px solid #eef2f6">${r.map((c,i)=>`<div style="flex:${i?1:1.6};${i===0?'font-weight:800;color:'+NAVY:''}">${c}</div>`).join('')}</div>`).join('')}</div>`;
const pill=(t,c='#e4f6ea',tc='#1a8a46')=>`<span class="chip" style="background:${c};color:${tc}">${esc(t)}</span>`;
const dash=(o)=>`<div class="row" style="height:100%;align-items:stretch">${side(o.menu||[['home','Dashboard'],['user','Customers'],['cube','Orders'],['chart','Reports'],['gear','Settings']],o.active||0)}<div style="flex:1;padding:18px 20px;background:#f6f9fc"><div class="row h" style="justify-content:space-between;font-size:18px;color:${NAVY}"><span>${esc(o.title)}</span><span class="btn" style="background:${NAVY};color:#fff;padding:7px 14px;font-size:11px">+ ${esc(o.btn||'New')}</span></div><div class="row" style="gap:12px;margin:14px 0">${(o.kpis||[]).map(k=>kpi(...k)).join('')}</div>${o.body||''}</div></div>`;
const code=(lines,fn='index.js')=>`<div style="height:100%;background:#0f1b2b;color:#d6e6f7;font-family:ui-monospace,Menlo,monospace;font-size:12.5px"><div class="row" style="height:32px;background:#0b1522;padding:0 14px;gap:14px;font-size:11px;color:#8ea6c0"><span style="color:#fff;border-bottom:2px solid ${SKY};padding:8px 0">${esc(fn)}</span></div><div style="padding:16px 18px;line-height:1.75">${lines.map((l,i)=>`<div><span style="color:#4d6882;display:inline-block;width:26px">${i+1}</span>${l}</div>`).join('')}</div></div>`;
const kw=t=>`<span style="color:#7cc4ff">${t}</span>`,st=t=>`<span style="color:#a5e8a8">${t}</span>`,cm=t=>`<span style="color:#6f87a0">${t}</span>`,fnn=t=>`<span style="color:#f4d58d">${t}</span>`;

/* ---------- print pieces ---------- */
const card=(c1=NAVY,w=260,h=158,name='Your Brand')=>`<div style="width:${w}px;height:${h}px;background:${c1};color:#fff;position:relative;overflow:hidden"><div class="abs" style="right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;border:2px solid rgba(255,255,255,.2)"></div><div class="abs" style="left:18px;top:16px">${mark('#fff',34)}</div><div class="abs h" style="left:18px;bottom:30px;font-size:18px">${esc(name)}</div><div class="abs" style="left:18px;bottom:14px;font-size:9px;color:${SKY};letter-spacing:.15em">DEVDHA.IN</div></div>`;
const cardBack=(w=260,h=158)=>`<div style="width:${w}px;height:${h}px;background:#fafaf8;position:relative"><div class="abs" style="left:0;top:0;bottom:0;width:8px;background:${SKY}"></div><div class="abs h" style="left:24px;top:22px;font-size:17px;color:${NAVY}">Your Name</div><div class="abs mut" style="left:24px;top:44px;font-size:10px">Title · Business</div>${['+91 00000 00000','you@brand.in','www.brand.in'].map((t,i)=>`<div class="abs" style="left:24px;top:${78+i*20}px;font-size:10px;color:${NAVY}">● ${t}</div>`).join('')}<div class="abs" style="right:20px;bottom:16px">${mark(NAVY,40)}</div></div>`;
const letter=(w=300,h=424)=>`<div style="width:${w}px;height:${h}px;background:#fcfcfa;position:relative"><div class="abs row h" style="left:24px;top:22px;gap:8px;color:${NAVY};font-size:18px">${mark(NAVY,26)}Your Brand</div><div class="abs" style="left:24px;right:24px;top:62px;height:3px;background:${SKY}"></div>${Array.from({length:14},(_,i)=>`<div class="abs" style="left:24px;top:${110+i*20}px;width:${(w-48)*(i%4==3?.6:1)}px;height:6px;border-radius:3px;background:#dbe2ea"></div>`).join('')}<div class="abs" style="left:0;right:0;bottom:0;height:30px;background:${NAVY}"></div></div>`;
const envl=(w=360,h=170)=>`<div style="width:${w}px;height:${h}px;background:#faf9f4;position:relative"><div class="abs row h" style="left:16px;top:16px;gap:6px;color:${NAVY};font-size:14px">${mark(NAVY,22)}Your Brand</div><div class="abs" style="left:0;right:0;bottom:0;height:10px;background:${SKY}"></div>${[0,1,2].map(i=>`<div class="abs" style="left:${w*.5}px;top:${h*.5+i*18}px;width:${w*.34-i*20}px;height:6px;border-radius:3px;background:#d6dde6"></div>`).join('')}</div>`;
const flyer=(w=300,h=424,t1='BIG SALE',t2='Up to 50% off',c1=SKY,c2=NAVY)=>`<div style="width:${w}px;height:${h}px;background:${c1};position:relative;overflow:hidden"><div class="abs" style="left:0;right:0;bottom:0;height:46%;background:${c2}"></div><div class="abs" style="right:-60px;top:30px;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.35)"></div><div class="abs" style="left:20px;top:18px">${mark(c2,34)}</div><div class="abs h" style="left:20px;top:84px;font-size:54px;line-height:.95;color:${c2}">${esc(t1).replace(' ','<br>')}</div><div class="abs h" style="left:20px;top:${h*.58}px;font-size:19px;color:#fff;width:${w-40}px">${esc(t2)}</div><span class="btn abs" style="left:20px;top:${h*.74}px;background:${SKY};color:${c2};padding:9px 18px;font-size:12px">devdha.in</span></div>`;
const tee=(c,ink='#fff',w=360,print=true)=>`<svg width="${w}" viewBox="0 0 360 340"><path d="M118 10 C130 34 160 40 180 40 C200 40 230 34 242 10 L318 48 L346 120 L290 138 L268 100 L268 326 L92 326 L92 100 L70 138 L14 120 L42 48 Z" fill="${c}" stroke="rgba(0,0,0,.18)" stroke-width="2"/><path d="M118 10 C130 34 160 40 180 40 C200 40 230 34 242 10" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="8"/>${print?`<g transform="translate(130 96)">${mark(ink,60)}<text x="30" y="92" text-anchor="middle" font-family="Inter" font-weight="800" font-size="22" fill="${ink}">Devdha</text><text x="30" y="112" text-anchor="middle" font-family="Inter" font-weight="800" font-size="9" fill="${ink}" opacity=".8">YOUR DESIGN</text></g>`:''}</svg>`;
const hoodie=(c,ink='#fff',w=340)=>`<svg width="${w}" viewBox="0 0 340 360"><path d="M110 18 C120 52 150 58 170 58 C190 58 220 52 230 18 L296 52 L330 150 L282 166 L268 124 L268 340 L72 340 L72 124 L58 166 L10 150 L44 52 Z" fill="${c}" stroke="rgba(0,0,0,.2)" stroke-width="2"/><path d="M110 18 C124 70 150 82 170 82 C190 82 216 70 230 18 C214 36 190 44 170 44 C150 44 126 36 110 18Z" fill="rgba(0,0,0,.18)"/><rect x="108" y="248" width="124" height="54" rx="10" fill="rgba(0,0,0,.14)"/><g transform="translate(146 128)">${mark(ink,52)}</g></svg>`;
const cap=(c,ink='#fff')=>`<svg width="300" viewBox="0 0 300 190"><path d="M40 130 C30 50 90 14 150 14 C210 14 270 50 260 130 Z" fill="${c}" stroke="rgba(0,0,0,.2)" stroke-width="2"/><path d="M30 130 C90 160 210 160 290 126 C250 112 150 112 40 126Z" fill="rgba(0,0,0,.28)"/><g transform="translate(128 52)">${mark(ink,48)}</g></svg>`;
const poster=(w=300,h=424,t='EVENT NIGHT',s='Live music · Food · Fun',c=NAVY)=>`<div style="width:${w}px;height:${h}px;background:${c};position:relative;overflow:hidden;color:#fff"><div class="abs" style="left:-80px;bottom:-80px;width:340px;height:340px;border-radius:50%;background:${SKY}"></div><div class="abs" style="right:24px;top:24px">${mark('#fff',40)}</div><div class="abs h" style="left:22px;top:90px;font-size:50px;line-height:.98;width:${w-44}px">${esc(t).replace(' ','<br>')}</div><div class="abs" style="left:22px;top:${h*.5}px;font-size:15px;color:${SKY}">${esc(s)}</div><span class="btn abs" style="left:22px;bottom:28px;background:#fff;color:${c};padding:9px 18px;font-size:12px">Book now</span></div>`;

const status=(rows)=>`<div class="row" style="height:100%;align-items:stretch">${side([['bolt','Status'],['shield','Security'],['gear','Updates'],['chart','Backups']],0)}<div style="flex:1;padding:18px 20px;background:#f6f9fc"><div class="row" style="gap:10px;margin-bottom:12px"><div class="card row" style="gap:10px;padding:12px 16px;flex:1"><div style="width:12px;height:12px;border-radius:50%;background:#22b55e;box-shadow:0 0 0 5px #22b55e33"></div><div><div class="h" style="font-size:14px;color:${NAVY}">All systems operational</div><div class="mut" style="font-size:10px">Uptime 99.98% · last 30 days</div></div></div></div><div class="card" style="padding:12px;margin-bottom:12px"><div class="row" style="gap:3px;height:30px">${Array.from({length:60},(_,i)=>`<div style="flex:1;height:100%;border-radius:2px;background:${i==37?'#f5b301':'#22b55e'}"></div>`).join('')}</div></div>${rows.map(([t,s,ok])=>`<div class="card row" style="padding:10px 14px;margin-bottom:8px;justify-content:space-between;font-size:12px"><span class="h">${t}</span><span class="mut">${s}</span>${pill(ok?'Done':'Scheduled',ok?'#e4f6ea':'#fff4d6',ok?'#1a8a46':'#8a6a00')}</div>`).join('')}</div></div>`;
